# Applied to every source before a candidate is persisted. These terms identify
# a subject that is unambiguously political or military; broad technical terms
# such as "policy", "war", "government", and country names remain subject to
# the mandatory candidate review because they produce false positives.
global_exclude_keywords:
  - armed forces
  - autonomous weapons
  - weapons systems
  - weapon system
  - military
  - militarization
