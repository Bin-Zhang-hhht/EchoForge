name: Collect podcast metadata

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Test collector in project container
        run: docker compose run --rm collector-test

      - name: Collect metadata in project container
        env:
          COLLECT_OUTPUT_DIR: ./data/items
        run: |
          set +e
          docker compose run --rm collect > collection-summary.md 2>&1
          status=$?
          set -e
          cat collection-summary.md
          cat collection-summary.md >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Validate pending metadata in project container
        env:
          COLLECT_OUTPUT_DIR: ./data/items
        run: docker compose run --rm pending --limit 10

      - name: Commit new metadata
        run: |
          rm -f collection-summary.md
          git add data/items
          if git diff --cached --quiet; then
            echo 'No new podcast metadata.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: collect podcast metadata'
          git push origin HEAD:main
