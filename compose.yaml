services:
  workflow-lint:
    image: rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
    working_dir: /workspace
    volumes:
      - .:/workspace:ro

  site-build:
    build:
      context: .
      target: site-runtime
    command:
      - sh
      - -c
      - rm -rf site && cp -a /source/site ./site && cp /source/build-index.mjs ./scripts/build-index.mjs && npm run site:build && rm -rf /output/* && cp -a site/.vitepress/dist/. /output/
    volumes:
      - ./site:/source/site:ro
      - ./scripts/build-index.mjs:/source/build-index.mjs:ro
      - ./data:/workspace/data:ro
      - ${SITE_OUTPUT_DIR:-./.cache/docker/site-dist}:/output

  collector-test:
    build:
      context: .
      target: collector-test
    volumes:
      - ./scripts:/workspace/scripts:ro
      - ./tests:/workspace/tests:ro
      - ./data:/workspace/data:ro
      - ./site:/workspace/site:ro

  content-check:
    build:
      context: .
      target: content-check
    volumes:
      - ./.git:/workspace/.git:ro
      - ./scripts:/workspace/scripts:ro
      - ./data:/workspace/data:ro
      - ./site:/workspace/site:ro

  asr-reserve:
    build:
      context: .
      target: collector-runtime
    entrypoint:
      - python
      - scripts/reserve_asr.py
    volumes:
      - ./scripts:/workspace/scripts:ro
      - ./data/items:/workspace/data/items:ro
      - ${LOCAL_LIBRARY_DIR:-./local-library}:/workspace/local-library

  transcript-archive:
    build:
      context: .
      target: collector-runtime
    entrypoint:
      - python
      - scripts/archive_transcript.py
    volumes:
      - ./scripts:/workspace/scripts:ro
      - ./data/items:/workspace/data/items:ro
      - ${LOCAL_LIBRARY_DIR:-./local-library}:/workspace/local-library
      - ${TRANSCRIPT_INPUT_DIR:-./.cache/transcript-input}:/input:ro

  collect:
    build:
      context: .
      target: collector-runtime
    command:
      - python
      - scripts/collect.py
      - --config
      - config/sources.yaml
      - --output-dir
      - /output
    volumes:
      - ./scripts:/workspace/scripts:ro
      - ./config:/workspace/config:ro
      - ${COLLECT_OUTPUT_DIR:-./.cache/docker/collected-items}:/output

  pending:
    build:
      context: .
      target: collector-runtime
    entrypoint:
      - python
      - scripts/pending.py
      - --items-dir
      - /output
    volumes:
      - ./scripts:/workspace/scripts:ro
      - ${COLLECT_OUTPUT_DIR:-./.cache/docker/collected-items}:/output
